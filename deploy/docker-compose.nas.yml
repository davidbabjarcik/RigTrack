# Hotový balík pre NAS: nič sa tu nezostavuje, nginx iba servíruje priečinok dist.
# Balík vytvorí `npm run package` (priečinok release/).
services:
  rigtrack:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
