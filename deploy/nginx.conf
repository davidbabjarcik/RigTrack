server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Appka sa nedá vložiť do cudzej stránky (clickjacking); kamera na QR a poloha na dochádzku len pre appku.
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    server_tokens off;

    # Súbory s hashom v názve sa nikdy nemenia.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # Service worker, manifest a index.html sa musia vždy overiť, inak by
    # používatelia ostali na starej verzii.
    location ~* ^/(index\.html|sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # SPA fallback: /equipment/123 a pod. obslúži index.html.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri /index.html;
    }
}
